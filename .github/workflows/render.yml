name: Render Fahmid Advert

# Runs automatically whenever you push to main, and can also be run
# manually from the "Actions" tab on GitHub with the "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm install

      - name: Install voiceover tools (Piper, open-source text-to-speech)
        run: pip install piper-tts pydub

      - name: Install ffmpeg (needed by pydub to encode the mp3 voiceover)
        # GitHub's ubuntu-latest (24.04) runner image no longer ships ffmpeg
        # by default. pydub's AudioSegment.export(..., format="mp3") shells
        # out to a system ffmpeg/avconv binary - without it, the "Stitch
        # voiceover together" step fails immediately with:
        #   FileNotFoundError: [Errno 2] No such file or directory: 'ffmpeg'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Download British English voice
        run: |
          set -euo pipefail
          mkdir -p voiceover/voice

          # --fail makes curl exit non-zero on HTTP errors instead of
          # silently writing an error/rate-limit page to disk as if it were
          # the model file. --retry/--retry-all-errors ride out transient
          # 429/5xx responses from Hugging Face, and a real User-Agent avoids
          # some hosts' bot-blocking of default CI user agents.
          CURL_OPTS=(--fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -A "Mozilla/5.0 (GitHub Actions; fahmid-advert-render)")

          curl "${CURL_OPTS[@]}" -o voiceover/voice/en_GB-alan-medium.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_GB/alan/medium/en_GB-alan-medium.onnx
          curl "${CURL_OPTS[@]}" -o voiceover/voice/en_GB-alan-medium.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_GB/alan/medium/en_GB-alan-medium.onnx.json

          # Sanity-check what we actually got: the real .onnx is ~63MB and
          # the .json is a few KB. Anything wildly smaller is almost always
          # an HTML error/rate-limit page saved under the wrong extension.
          onnx_size=$(stat -c%s voiceover/voice/en_GB-alan-medium.onnx)
          json_size=$(stat -c%s voiceover/voice/en_GB-alan-medium.onnx.json)
          echo "Downloaded onnx: ${onnx_size} bytes, json: ${json_size} bytes"
          if [ "$onnx_size" -lt 1000000 ] || [ "$json_size" -lt 100 ]; then
            echo "::error::Downloaded voice files look too small to be valid - the download likely failed or was rate-limited. First bytes of onnx file:"
            head -c 300 voiceover/voice/en_GB-alan-medium.onnx
            exit 1
          fi

      - name: Generate voiceover lines
        run: |
          set -uo pipefail
          mkdir -p voiceover/parts
          i=0
          failures=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            i=$((i+1))
            num=$(printf "%02d" "$i")
            if ! echo "$line" | python3 -m piper \
              --model voiceover/voice/en_GB-alan-medium.onnx \
              --output_file "voiceover/parts/${num}.wav"; then
              echo "::warning::Piper failed to synthesize line ${num}: ${line}"
              failures=$((failures+1))
            fi
          done < voiceover/script.txt

          echo "Generated $((i-failures))/${i} voiceover lines."
          # Don't hard-fail the whole render over TTS trouble - build_audio.py
          # falls back to a silent track if no parts were produced at all, so
          # a flaky voice download degrades the video instead of blocking it.

      - name: Stitch voiceover together
        run: |
          mkdir -p public
          python3 voiceover/build_audio.py

      - name: Install Chrome headless shell (needed by Remotion)
        run: npx remotion browser ensure

      - name: Render the video
        run: npx remotion render src/index.ts FahmidAdvert out/fahmid-advert.mp4

      - name: Upload the finished video
        uses: actions/upload-artifact@v4
        with:
          name: fahmid-advert-video
          path: out/fahmid-advert.mp4
          retention-days: 30
